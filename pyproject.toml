[project]
name = "homebuddy-access"
version = "1.0.5"
description = "HomeBuddy connection QR setup for Home Assistant"
requires-python = ">=3.14.2,<3.15"
dependencies = ["segno==1.6.6"]

[dependency-groups]
dev = [
  "homeassistant==2026.10.2",
  "home-assistant-frontend==20260930.4",
  "pytest-homeassistant-custom-component==0.13.373",
  "pytest==9.0.3",
  "ruff==0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
